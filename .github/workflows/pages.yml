# Deploys the site to GitHub Pages and builds portfolio.pdf from it on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy site files
        run: rsync -a --exclude .git --exclude .github --exclude tools --exclude _site ./ _site/

      # A stalled package mirror shouldn't hold the deploy hostage (the default job limit is 6 hours)
      - name: Install PDF tools
        timeout-minutes: 5
        run: |
          npm install --prefix tools
          tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Build portfolio.pdf
        run: node tools/build-pdf.js _site _site/portfolio.pdf

      # Version the CSS/JS URLs per deploy so browsers never pair a new page with a cached old stylesheet
      - name: Cache-bust assets
        run: find _site -name '*.html' -exec sed -i -E "s/(style\.css|script\.js)\"/\1?v=${GITHUB_SHA::7}\"/g" {} +

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
